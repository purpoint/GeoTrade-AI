name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: geotrade, POSTGRES_PASSWORD: geotrade-dev, POSTGRES_DB: geotrade }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://geotrade:geotrade-dev@localhost:5432/geotrade_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: Lint and types
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run lint-imports
      - name: Tests (unit, fixtures, pipeline and API against Postgres, migration drift)
        run: uv run pytest
      - name: OpenAPI contract is committed
        run: uv run backend openapi --out ../../packages/shared/openapi.json && git diff --exit-code ../../packages/shared/openapi.json
      - name: Golden set report
        run: uv run backend evaluate
      - uses: actions/upload-artifact@v4
        with: { name: golden-report, path: data/golden/reports/*.json }

  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: services/ui/package-lock.json }
      - run: npm ci
      - name: Generated API types match openapi.json
        run: npm run gen:api && git diff --exit-code lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
