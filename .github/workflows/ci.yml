name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: geotrade, POSTGRES_PASSWORD: geotrade-dev, POSTGRES_DB: geotrade }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://geotrade:geotrade-dev@localhost:5432/geotrade_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: Lint and types
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run lint-imports
      - name: Dependency audit (P3-BE-10)
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -o /tmp/req.txt && uvx pip-audit -r /tmp/req.txt --no-deps --disable-pip
      - name: Tests (unit, fixtures, pipeline and API against Postgres, migration drift)
        run: uv run pytest
      - name: Contract tests (Schemathesis, every operation, no server errors)
        run: uv run pytest -m contract
      - name: OpenAPI contract is committed
        run: uv run backend openapi --out ../../packages/shared/openapi.json && git diff --exit-code ../../packages/shared/openapi.json
      - name: Golden set report
        run: uv run backend evaluate
      - uses: actions/upload-artifact@v4
        with: { name: golden-report, path: data/golden/reports/*.json }

  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: services/ui/package-lock.json }
      - run: npm ci
      - name: Dependency audit (P3-BE-10)
        run: npm audit --omit=dev --audit-level=high
      - name: Generated API types match openapi.json
        run: npm run gen:api && git diff --exit-code lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build the backend image
        run: docker build -f services/backend/Dockerfile -t geotrade-ai/backend:ci .
      - name: Container image scan (HIGH and CRITICAL with a fix)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: geotrade-ai/backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    runs-on: ubuntu-latest
    env:
      OPERATOR_EMAIL: ops@example.com
      OPERATOR_PASSWORD: e2e-operator-passphrase
      RATE_LIMIT_AUTH_PER_MIN: "1000"
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack (database, migrate + seed, api, worker, ui)
        run: docker compose up -d --build
      - name: Wait for the UI and API
        run: timeout 300 sh -c 'until curl -sf http://localhost:3000/api/v1/health/ready; do sleep 3; done'
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: services/ui/package-lock.json }
      - working-directory: services/ui
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright journeys (desktop and phone)
        working-directory: services/ui
        env:
          BASE_URL: http://localhost:3000
          E2E_OPERATOR_EMAIL: ops@example.com
          E2E_OPERATOR_PASSWORD: e2e-operator-passphrase
        run: npm run e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: services/ui/test-results }
