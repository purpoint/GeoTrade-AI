name: geotrade-ai

x-backend: &backend
  build:
    context: ../..
    dockerfile: services/backend/Dockerfile
  image: geotrade-ai/backend
  env_file:
    - path: ../../.env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-geotrade}:${POSTGRES_PASSWORD:-geotrade-dev}@database:5432/${POSTGRES_DB:-geotrade}
    # operator login for /admin (created by `backend seed --demo` when both are set)
    OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
    OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
    RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-10}
    # local: digests (worker) and operator test sends (api) go to Mailpit at http://localhost:8025
    EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
    SMTP_HOST: mailpit
    SMTP_PORT: 1025

services:
  database:
    build: ../../services/database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geotrade}
      POSTGRES_USER: ${POSTGRES_USER:-geotrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geotrade-dev}
      PGUSER: ${POSTGRES_USER:-geotrade}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../backups:/backups
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-geotrade}"]
      interval: 5s
      retries: 20

  # nightly pg_dump into ./backups (P1-DB-10)
  database-backup:
    build: ../../services/database
    entrypoint: ["sh", "-c", "while true; do sleep 86400; /usr/local/bin/geotrade/backup.sh; done"]
    environment:
      PGHOST: database
      PGUSER: ${POSTGRES_USER:-geotrade}
      PGPASSWORD: ${POSTGRES_PASSWORD:-geotrade-dev}
      POSTGRES_DB: ${POSTGRES_DB:-geotrade}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
    volumes: ["../../backups:/backups", "${RCLONE_CONFIG_DIR:-../../backups/.rclone}:/root/.config/rclone:ro"]
    depends_on: { database: { condition: service_healthy } }

  # one-shot: schema, reference data and (by default) a week of sample history
  backend-migrate:
    <<: *backend
    entrypoint: ["sh", "-c", "backend migrate && backend seed ${SEED_ARGS:---history --demo}"]
    depends_on: { database: { condition: service_healthy } }

  backend-api:
    <<: *backend
    command: ["backend", "api", "--workers", "1"]
    environment:
      <<: *backend-env
      DB_POOL_SIZE: 10  # P3-DB-04: api 10, worker 5
    ports: ["8000:8000"]
    depends_on: { backend-migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      retries: 10

  backend-worker:
    <<: *backend
    command: ["backend", "worker"]
    environment:
      <<: *backend-env
      LLM_PROVIDER: groq
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.8-27b}
      DB_POOL_SIZE: 5
    depends_on:
      backend-migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started, required: false }  # absent in compose.prod.yml

  ui:
    build:
      context: ../../services/ui
      args: { BACKEND_URL: "http://backend-api:8000" }
    ports: ["3000:3000"]
    depends_on: { backend-api: { condition: service_healthy } }

  # catches every digest email locally (P3-BE-04); compose.prod.yml leaves it out
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata:
