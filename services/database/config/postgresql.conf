# Sized for the 1 GB Railway trial container (P3-DB-04); the same values suit a laptop.
# Connections: api pool 10 (+5 overflow) + worker pool 5 (+5) + migrate/backup/psql, well under 50.
# On Railway's managed Postgres apply these with ALTER SYSTEM (see docs/deploy.md).
shared_buffers = 128MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 384MB
max_connections = 50
idle_in_transaction_session_timeout = 60s
log_min_duration_statement = 500
